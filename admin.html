<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script src="app.js"></script> 

<script>
    // Falls 'db' in app.js anders benannt ist (z.B. database), hier anpassen.
    // Wir stellen sicher, dass db existiert, falls app.js es als 'db' exportiert.
    
    // Liste beim Start auslesen
    db.ref('users').on('value', snap => {
        const users = snap.val();
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = ""; // Tabelle leeren

        if (!users) return;

        for (let uid in users) {
            const user = users[uid];
            
            // Tabellenzeile generieren
            const tr = document.createElement('tr');
            
            // Prüfen, ob das Schul-ID Feld angezeigt werden muss (falls bereits principal)
            const showSchoolInput = user.role === 'principal' ? 'inline-block' : 'none';

            tr.innerHTML = `
                <td>${user.name || 'Unbekannt'}</td>
                <td>${user.email}</td>
                <td>
                    <select id="role-${uid}" onchange="toggleSchoolInput('${uid}')">
                        <option value="none" ${user.role === 'none' ? 'selected' : ''}>None (Keine Rechte)</option>
                        <option value="principal" ${user.role === 'principal' ? 'selected' : ''}>Principal (Schulleiter)</option>
                        <option value="westroad" ${user.role === 'westroad' ? 'selected' : ''}>Westroad Admin</option>
                    </select>
                    <input type="text" id="school-${uid}" class="school-input" placeholder="School ID" value="${user.schoolID || ''}" style="display: ${showSchoolInput};">
                </td>
                <td>
                    <button class="btn-save" onclick="saveUser('${uid}')">Save</button>
                </td>
            `;
            tbody.appendChild(tr);
        }
    });

    // Zeigt das Inputfeld für die School ID nur an, wenn 'principal' ausgewählt ist
    function toggleSchoolInput(uid) {
        const roleSelect = document.getElementById(`role-${uid}`).value;
        const schoolInput = document.getElementById(`school-${uid}`);
        if (roleSelect === 'principal') {
            schoolInput.style.display = 'inline-block';
        } else {
            schoolInput.style.display = 'none';
            schoolInput.value = ''; // Reset falls gewechselt wird
        }
    }

    // Speichert die Änderungen zurück in die Firebase Realtime Database
    function saveUser(uid) {
        const selectedRole = document.getElementById(`role-${uid}`).value;
        let schoolIDValue = document.getElementById(`school-${uid}`).value;

        // Wenn die Rolle zurück auf 'none' oder ungleich 'principal' gesetzt wird, löschen wir die School ID
        if (selectedRole !== 'principal') {
            schoolIDValue = "";
        }

        db.ref('users/' + uid).update({
            role: selectedRole,
            schoolID: schoolIDValue
        }).then(() => {
            alert("Änderungen erfolgreich gespeichert!");
        }).catch(err => {
            alert("Fehler beim Speichern: " + err.message);
        });
    }
</script>
