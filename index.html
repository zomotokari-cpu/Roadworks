<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - West Coast Transport Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
        }
        .login-container {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px !important; /* Prevents iOS auto-zoom */
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: background 0.2s;
        }
        .btn-primary {
            background: var(--primary, #409EFF);
            color: #fff;
        }
        .btn-secondary {
            background: #222;
            color: #fff;
            margin-bottom: 25px; /* Spacing below the public map button */
        }
        .divider {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #ccc;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px 20px;
                box-shadow: none;
                background: transparent;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2 style="text-align: center; margin-bottom: 25px;">West Coast Hub</h2>
            
            <!-- Quick Public Access Button for Parents (Uses pre-filled credentials) -->
            <button class="btn btn-secondary" onclick="quickParentLogin()">View Live Map</button>
            
            <!-- Structural Divider Line -->
            <div class="divider">Staff Administration</div>

            <!-- Standard Authorized Login Form -->
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@school.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" onclick="login()" style="margin-top: 15px;">Sign In</button>
            
            <p id="error-msg" style="color: var(--danger); margin-top: 15px; font-size: 0.85rem; font-weight: 600; text-align: center;"></p>
        </div>
    </div>

    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        // Trigger login on pressing Enter inside password field
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        // 1. QUICK LOGIN FOR PARENTS (Using specific test account)
        function quickParentLogin() {
            executeAuth("par@test.com", "123456");
        }

        // 2. STANDARD STAFF ACCOUNT LOGIN FROM FORM inputs
        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            
            if (!e || !p) {
                document.getElementById('error-msg').innerText = "Please fill in all fields.";
                return;
            }

            executeAuth(e, p);
        }

        // Core authentication and redirection handler pipeline
        function executeAuth(email, password) {
            auth.signInWithEmailAndPassword(email, password).then((userCredential) => {
                db.ref('users/' + userCredential.user.uid).once('value').then(snap => {
                    const userData = snap.val();
                    if (!userData) {
                        document.getElementById('error-msg').innerText = "User configuration missing.";
                        return;
                    }
                    
                    const role = userData.role;
                    if(role === 'parent') window.location.href = 'parent.html';
                    if(role === 'principal') window.location.href = 'principal.html';
                    if(role === 'westroad') window.location.href = 'westroad.html';
                });
            }).catch(error => {
                console.error("Auth Error: ", error);
                document.getElementById('error-msg').innerText = "Invalid credentials. Please try again.";
            });
        }
    </script>
</body>
</html>
