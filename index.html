<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>West Coast: Road and Bus Informations</title>
    <style>
        /* Eigenständiges Farbschema (Unabhängig von der style.css) */
        :root {
            --wdc-navy: #002147;       /* Tiefes Marineblau für den Haupt-Login */
            --wdc-navy-hover: #001530;
            --wdc-gold: #D97706;       /* Warmes Orange/Braun für den Map-Button */
            --wdc-gold-hover: #B45309;
            --wdc-text-dark: #1F2937;
            --wdc-border: #D1D5DB;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Kräftiger Blau-Grün-Verlauf im Hintergrund */
            background: linear-gradient(135deg, #022c22 0%, #047857 50%, #0369a1 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--wdc-text-dark);
        }
        
        .login-container {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }
        
        .login-box {
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.96);
            padding: 40px 30px;
            border-radius: 6px;
            border-top: 6px solid var(--wdc-navy);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: var(--wdc-navy);
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--wdc-navy);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px; 
            box-sizing: border-box;
            border: 1px solid var(--wdc-border);
            border-radius: 4px;
            background: #FAFAFA;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--wdc-navy);
            box-shadow: 0 0 0 3px rgba(0, 33, 71, 0.15);
            background: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.99);
        }

        /* Orange/Braun für den schnellen Map-Zugang */
        .btn-secondary {
            background: var(--wdc-gold);
            color: #ffffff;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
        }

        .btn-secondary:hover {
            background: var(--wdc-gold-hover);
        }

        /* Dunkles Grün-Blau / Marineblau für den Admin-Login */
        .btn-primary {
            background: var(--wdc-navy);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 33, 71, 0.15);
        }

        .btn-primary:hover {
            background: var(--wdc-navy-hover);
        }

        .divider {
            text-align: center;
            position: relative;
            margin-bottom: 24px;
            color: #6B7280;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 22%;
            height: 1px;
            background: var(--wdc-border);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
                background: #ffffff;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Main Page</h2>
            
            <button class="btn btn-secondary" onclick="quickParentLogin()">View Live Map</button>
            
            <div class="divider">Staff Administration</div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g. name@gmail.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" onclick="login()" style="margin-top: 10px;">Sign In</button>
            
            <div class="divider">New Users</div>
            <button class="btn" onclick="createAccountWithGoogle()" style="background: #4285F4; color: white; box-shadow: 0 4px 12px rgba(66, 133, 244, 0.2);">
                Create Account with Google
            </button>
            
            <p id="error-msg" style="color: #EF4444; margin-top: 15px; font-size: 0.85rem; font-weight: 600; text-align: center; margin-bottom: 0; min-height: 20px;"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        // Google Auth Provider initialisieren
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // Trigger login on pressing Enter inside password field
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        // 1. QUICK LOGIN FOR PARENTS (Using specific test account)
        function quickParentLogin() {
            executeAuth("par@test.com", "123456");
        }

        // 2. STANDARD STAFF ACCOUNT LOGIN FROM FORM inputs
        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            
            if (!e || !p) {
                document.getElementById('error-msg').style.color = "#EF4444";
                document.getElementById('error-msg').innerText = "Please fill in all fields.";
                return;
            }

            executeAuth(e, p);
        }

        // 3. GOOGLE ACCOUNT ERSTELLUNG / ANMELDUNG
        function createAccountWithGoogle() {
            // Button holen und deaktivieren gegen Doppel-Klicks
            const googleBtn = document.querySelector("button[onclick='createAccountWithGoogle()']");
            if (googleBtn) {
                googleBtn.disabled = true;
                googleBtn.innerText = "Loading Google...";
            }
        
            auth.signInWithPopup(googleProvider).then((result) => {
                const user = result.user;
                
                // Prüfen, ob der User bereits in der Realtime Database existiert
                db.ref('users/' + user.uid).once('value').then(snap => {
                    if (!snap.exists()) {
                        // Account existiert noch nicht -> Neu anlegen mit Rolle 'none'
                        db.ref('users/' + user.uid).set({
                            name: user.displayName || "Google User",
                            email: user.email,
                            role: 'none',
                            schoolID: ''
                        }).then(() => {
                            document.getElementById('error-msg').style.color = "#34D399"; // Grün für Erfolg
                            document.getElementById('error-msg').innerText = "Account erstellt. Bitte schreiben Sie den Admin an.";
                            
                            // Sicherer Timeout für das SignOut, damit Firebase den Auth-State-Wechsel verarbeitet hat
                            setTimeout(() => { 
                                auth.signOut(); 
                                if (googleBtn) { googleBtn.disabled = false; googleBtn.innerText = "Create Account with Google"; }
                            }, 1000);
                        }).catch(err => {
                            console.error("DB Write Error:", err);
                            if (googleBtn) { googleBtn.disabled = false; googleBtn.innerText = "Create Account with Google"; }
                        });
                    } else {
                        // Account existiert bereits in der DB
                        const userData = snap.val();
                        if (userData.role === 'none') {
                            document.getElementById('error-msg').style.color = "#EF4444";
                            document.getElementById('error-msg').innerText = "Ihr Account hat noch keine Rechte. Bitte schreiben Sie den Admin an.";
                            setTimeout(() => { 
                                auth.signOut(); 
                                if (googleBtn) { googleBtn.disabled = false; googleBtn.innerText = "Create Account with Google"; }
                            }, 1000);
                        } else {
                            // Wenn er bereits freigeschaltet wurde, direkt weiterleiten
                            if (googleBtn) { googleBtn.disabled = false; googleBtn.innerText = "Create Account with Google"; }
                            redirectBasedOnRole(userData.role);
                        }
                    }
                });
            }).catch(error => {
                // Button bei Fehler wieder freigeben
                if (googleBtn) {
                    googleBtn.disabled = false;
                    googleBtn.innerText = "Create Account with Google";
                }
                
                // Ignoriere den nervigen Abbruch-Fehler im UI, falls das Popup nur im Hintergrund blockiert wurde
                if (error.code === "auth/cancelled-popup-request") {
                    console.log("Popup-Anfrage im Hintergrund neu sortiert.");
                    return;
                }
                
                console.error("Google Auth Error: ", error);
                document.getElementById('error-msg').style.color = "#EF4444";
                document.getElementById('error-msg').innerText = "Google-Anmeldung fehlgeschlagen: " + error.message;
            });
        }

        // Core authentication and redirection handler pipeline
        function executeAuth(email, password) {
            auth.signInWithEmailAndPassword(email, password).then((userCredential) => {
                // Sonderfall: Dein manuell angelegter Admin-Account in Firebase Auth
                if (email === "admin@test.com") {
                    window.location.href = 'admin.html';
                    return;
                }

                db.ref('users/' + userCredential.user.uid).once('value').then(snap => {
                    const userData = snap.val();
                    if (!userData || userData.role === 'none') {
                        document.getElementById('error-msg').style.color = "#EF4444";
                        document.getElementById('error-msg').innerText = "Zugriff verweigert. Bitte Admin kontaktieren.";
                        auth.signOut();
                        return;
                    }
                    
                    redirectBasedOnRole(userData.role);
                });
            }).catch(error => {
                console.error("Auth Error: ", error);
                document.getElementById('error-msg').style.color = "#EF4444";
                document.getElementById('error-msg').innerText = "Invalid credentials. Please try again.";
            });
        }

        // Hilfsfunktion für die Weiterleitung nach Rolle
        function redirectBasedOnRole(role) {
            if(role === 'parent') window.location.href = 'parent.html';
            if(role === 'principal') window.location.href = 'principal.html';
            if(role === 'westroad') window.location.href = 'westroad.html';
        }
    </script>
</body>
</html>
