<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - West Coast Transport Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>West Coast Hub</h2>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@school.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" onclick="login()" style="margin-top: 10px;">Sign In</button>
            <p id="error-msg" style="color: var(--danger); margin-top: 15px; font-size: 0.85rem; font-weight: 600;"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).then((userCredential) => {
                db.ref('users/' + userCredential.user.uid).once('value').then(snap => {
                    const role = snap.val().role;
                    if(role === 'parent') window.location.href = 'parent.html';
                    if(role === 'principal') window.location.href = 'principal.html';
                    if(role === 'westroad') window.location.href = 'westroad.html';
                });
            }).catch(error => document.getElementById('error-msg').innerText = "Invalid credentials. Please try again.");
        }
    </script>
</body>
</html>
