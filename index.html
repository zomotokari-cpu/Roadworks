<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - West Coast Transport Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mobile-first enhancements to guarantee flawless touch scaling */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        /* Touch target optimization for inputs and buttons */
        .input-group input {
            width: 100%;
            padding: 12px; /* Increased padding for better touch precision */
            font-size: 16px !important; /* Prevents iOS auto-zoom on focus */
            box-sizing: border-box;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 25px 20px;
                box-shadow: none; /* Simplifies look on very small screens if styled in style.css */
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>West Coast Hub</h2>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@school.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" onclick="login()" style="margin-top: 15px;">Sign In</button>
            <p id="error-msg" style="color: var(--danger); margin-top: 15px; font-size: 0.85rem; font-weight: 600; text-align: center;"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        // Native submit on pressing 'Enter' key within fields for desktop efficiency
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            
            if (!e || !p) {
                document.getElementById('error-msg').innerText = "Please fill in all fields.";
                return;
            }

            auth.signInWithEmailAndPassword(e, p).then((userCredential) => {
                db.ref('users/' + userCredential.user.uid).once('value').then(snap => {
                    const userData = snap.val();
                    if (!userData) {
                        document.getElementById('error-msg').innerText = "User configuration missing.";
                        return;
                    }
                    
                    const role = userData.role;
                    if(role === 'parent') window.location.href = 'parent.html';
                    if(role === 'principal') window.location.href = 'principal.html';
                    if(role === 'westroad') window.location.href = 'westroad.html';
                });
            }).catch(error => {
                console.error("Auth Error: ", error);
                document.getElementById('error-msg').innerText = "Invalid credentials. Please try again.";
            });
        }
    </script>
</body>
</html>
